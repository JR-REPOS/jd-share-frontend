name: Publish frontend Pages
on:
  push:
    branches: [frontend-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: static
      - uses: actions/deploy-pages@v4
        id: deployment
